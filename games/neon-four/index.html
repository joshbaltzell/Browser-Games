<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Four</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04050d;
    --panel: #0a0e24;
    --cyan: #22f3ff;
    --cyan-deep: #0a8fb0;
    --magenta: #ff2bd6;
    --magenta-deep: #9b0f86;
    --violet: #8a5cff;
    --text: #d8e6ff;
    --dim: #7482b0;
    --gap: clamp(4px, 1.3vw, 10px);
    --bw: clamp(272px, min(100%, calc((100svh - 330px) * 7 / 6)), 540px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Background: glow + drifting perspective grid ---------- */
  .bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 50% at 50% -5%, rgba(138, 92, 255, .38), transparent 70%),
      radial-gradient(ellipse 70% 45% at 50% 110%, rgba(34, 243, 255, .2), transparent 70%),
      var(--bg);
  }
  .bg::before {
    content: ''; position: absolute; left: -50%; right: -50%; bottom: -10%; height: 55%;
    background:
      linear-gradient(rgba(34, 243, 255, .22) 1px, transparent 1px) 0 0 / 60px 60px,
      linear-gradient(90deg, rgba(34, 243, 255, .22) 1px, transparent 1px) 0 0 / 60px 60px;
    transform: perspective(380px) rotateX(62deg);
    transform-origin: 50% 100%;
    mask-image: linear-gradient(to top, #000 10%, transparent 90%);
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
    animation: gridDrift 3.5s linear infinite;
  }
  @keyframes gridDrift { to { background-position: 0 60px, 0 0; } }

  .back {
    position: fixed; top: 14px; left: 16px; z-index: 5;
    color: var(--dim); text-decoration: none; font-weight: 600; letter-spacing: .04em;
    transition: color .2s;
  }
  .back:hover { color: var(--cyan); }

  .app {
    max-width: 620px; margin: 0 auto;
    padding: 52px 16px 28px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }

  /* ---------- Header ---------- */
  .title {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(2rem, 8vw, 3.1rem); letter-spacing: .14em; line-height: 1;
    color: #eaf6ff;
    text-shadow: 0 0 6px rgba(34, 243, 255, .9), 0 0 22px rgba(34, 243, 255, .55);
  }
  .title span {
    color: #ffe6fb; margin-left: .3em;
    text-shadow: 0 0 6px rgba(255, 43, 214, .95), 0 0 24px rgba(255, 43, 214, .6);
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%, 92%, 96%, 100% { opacity: 1; }
    93%, 95% { opacity: .45; }
  }
  .tagline { color: var(--dim); text-align: center; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem; margin-top: 6px; }

  /* ---------- Scoreboard ---------- */
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; width: var(--bw); }
  .score {
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px;
    border-radius: 12px; background: rgba(10, 14, 36, .75);
    border: 1px solid rgba(116, 130, 176, .25);
  }
  .score .label { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .score .val { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.9rem; line-height: 1.1; }
  .score.you { border-color: rgba(34, 243, 255, .45); box-shadow: 0 0 16px rgba(34, 243, 255, .12) inset; }
  .score.you .val { color: var(--cyan); text-shadow: 0 0 10px rgba(34, 243, 255, .7); }
  .score.ai { border-color: rgba(255, 43, 214, .45); box-shadow: 0 0 16px rgba(255, 43, 214, .12) inset; }
  .score.ai .val { color: var(--magenta); text-shadow: 0 0 10px rgba(255, 43, 214, .7); }
  .score.draw .val { color: #b9a6ff; font-size: 1.5rem; }
  .val.bump { animation: bump .5s ease-out; }
  @keyframes bump { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }

  /* ---------- Controls ---------- */
  .controls { width: var(--bw); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
  .seg {
    display: inline-flex; border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(138, 92, 255, .5);
  }
  .seg button { border: 0; border-radius: 0; }
  .seg button + button { border-left: 1px solid rgba(138, 92, 255, .35); }
  .seg button[aria-checked="true"] {
    background: linear-gradient(180deg, rgba(138, 92, 255, .55), rgba(138, 92, 255, .25));
    color: #fff; text-shadow: 0 0 8px rgba(200, 180, 255, .9);
  }
  .actions { display: flex; gap: 8px; }

  button {
    font: 600 .9rem 'Rajdhani', system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text); background: rgba(10, 14, 36, .8);
    border: 1px solid rgba(34, 243, 255, .35); border-radius: 10px;
    padding: 7px 12px; cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s, color .15s;
  }
  button:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 12px rgba(34, 243, 255, .35); color: #fff; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  #newBtn.ready { border-color: var(--magenta); animation: readyPulse 1.2s ease-in-out infinite; }
  @keyframes readyPulse { 50% { box-shadow: 0 0 18px rgba(255, 43, 214, .6); } }

  /* ---------- Status ---------- */
  .status {
    width: var(--bw); min-height: 42px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: 'Orbitron', sans-serif; font-weight: 500; font-size: clamp(.8rem, 3.2vw, 1rem); letter-spacing: .1em;
    text-transform: uppercase; text-align: center;
  }
  .status .sub { font-family: 'Rajdhani', sans-serif; color: var(--dim); letter-spacing: .12em; font-size: .85em; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .dot.p1 { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .dot.p2 { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); }
  .dot.thinking { animation: blink .6s ease-in-out infinite alternate; }
  @keyframes blink { to { opacity: .25; transform: scale(.7); } }
  .status.win { color: var(--cyan); text-shadow: 0 0 12px rgba(34, 243, 255, .8); }
  .status.lose { color: var(--magenta); text-shadow: 0 0 12px rgba(255, 43, 214, .8); }
  .status.draw { color: #b9a6ff; }

  /* ---------- Board ---------- */
  .board-wrap { width: var(--bw); }
  .preview, .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--gap); }
  .preview { padding: 0 calc(var(--gap) + 1px); margin-bottom: 4px; }
  .slot { position: relative; aspect-ratio: 1; cursor: pointer; }

  .board {
    position: relative; padding: var(--gap); border-radius: 18px;
    background: linear-gradient(160deg, rgba(22, 28, 66, .92), rgba(7, 9, 26, .96));
    border: 1px solid rgba(34, 243, 255, .4);
    box-shadow:
      0 0 0 1px rgba(138, 92, 255, .25),
      0 0 46px rgba(34, 243, 255, .16),
      0 20px 60px rgba(0, 0, 0, .6),
      inset 0 0 34px rgba(138, 92, 255, .18);
  }
  .board::after { /* corner brackets */
    content: ''; position: absolute; inset: -6px; pointer-events: none;
    background:
      linear-gradient(var(--cyan), var(--cyan)) top left / 22px 2px,
      linear-gradient(var(--cyan), var(--cyan)) top left / 2px 22px,
      linear-gradient(var(--magenta), var(--magenta)) bottom right / 22px 2px,
      linear-gradient(var(--magenta), var(--magenta)) bottom right / 2px 22px;
    background-repeat: no-repeat;
    opacity: .8;
  }

  .cell {
    position: relative; aspect-ratio: 1; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 50% 38%, #01020a 52%, #0e1438 100%);
    box-shadow: inset 0 3px 9px rgba(0, 0, 0, .95), 0 0 0 1px rgba(120, 140, 255, .12);
    transition: box-shadow .15s;
  }
  .cell.hl { box-shadow: inset 0 3px 9px rgba(0, 0, 0, .95), 0 0 0 1px rgba(34, 243, 255, .4), 0 0 10px rgba(34, 243, 255, .12); }
  .cell.land::before, .cell.hint::before {
    content: ''; position: absolute; inset: 10%; border-radius: 50%;
    border: 2px dashed rgba(34, 243, 255, .55);
    animation: spin 5s linear infinite;
  }
  .cell.hint::before { border: 2px solid #fff6a8; box-shadow: 0 0 14px rgba(255, 246, 168, .8); animation: hintPulse .8s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes hintPulse { from { transform: scale(.85); opacity: .6; } to { transform: scale(1); opacity: 1; } }
  .board.locked .cell, .preview.locked .slot { cursor: default; }

  /* ---------- Discs ---------- */
  .disc, .ghost {
    position: absolute; inset: 6%; border-radius: 50%; pointer-events: none; opacity: 0;
  }
  .disc.p1, .ghost.p1 {
    background: radial-gradient(circle at 34% 28%, #f2ffff 0 7%, #6ffaff 17%, #14c8e2 52%, var(--cyan-deep) 82%, #033a4d 100%);
    box-shadow: 0 0 14px rgba(34, 243, 255, .7), inset 0 -4px 10px rgba(0, 30, 50, .55);
  }
  .disc.p2, .ghost.p2 {
    background: radial-gradient(circle at 34% 28%, #fff0fd 0 7%, #ff7ae8 17%, #f025c9 52%, var(--magenta-deep) 82%, #44063b 100%);
    box-shadow: 0 0 14px rgba(255, 43, 214, .7), inset 0 -4px 10px rgba(50, 0, 40, .55);
  }
  .disc::after, .ghost::after { /* inner tech ring */
    content: ''; position: absolute; inset: 22%; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .35);
    box-shadow: 0 0 6px rgba(255, 255, 255, .25) inset;
  }
  .disc.p1, .disc.p2 { opacity: 1; }
  .disc.drop { animation: drop var(--dur, 400ms) both; }
  @keyframes drop {
    0% {
      transform: translateY(calc(var(--n, 1) * -1 * (100% / .88 + var(--gap))));
      animation-timing-function: cubic-bezier(.55, 0, 1, .45);
    }
    72% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, .4, 1); }
    86% { transform: translateY(-9%); animation-timing-function: cubic-bezier(.6, 0, 1, 1); }
    100% { transform: translateY(0); }
  }

  .ghost { transition: opacity .12s; }
  .slot.show .ghost { opacity: .6; animation: hover 1.2s ease-in-out infinite alternate; }
  .slot.hint .ghost.p1 { opacity: .85; box-shadow: 0 0 22px #fff6a8, 0 0 14px rgba(34, 243, 255, .7); }
  @keyframes hover { from { transform: translateY(-4%); } to { transform: translateY(4%); } }

  .board.over .disc:not(.win) { filter: saturate(.35) brightness(.45); transition: filter .6s; }
  .disc.win { animation: winPulse .7s ease-in-out infinite alternate; z-index: 1; }
  @keyframes winPulse {
    from { transform: scale(1); filter: brightness(1); }
    to { transform: scale(1.1); filter: brightness(1.45) drop-shadow(0 0 10px #fff); }
  }

  .board.shake { animation: shake .25s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* ---------- Footer ---------- */
  .help { color: var(--dim); font-size: .85rem; letter-spacing: .05em; text-align: center; max-width: var(--bw); }
  .help kbd {
    font: 600 .78rem 'Rajdhani', sans-serif; padding: 1px 6px; border-radius: 4px;
    border: 1px solid rgba(116, 130, 176, .5); color: var(--text);
  }
  .link { background: none; border: 0; color: var(--dim); font-size: .75rem; padding: 4px; text-decoration: underline; }
  .link:hover:not(:disabled) { box-shadow: none; color: var(--magenta); }

  @media (max-width: 420px) {
    .controls { justify-content: center; }
    button { padding: 7px 9px; font-size: .82rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg::before, .title span, .slot.show .ghost, .cell.land::before { animation: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<a class="back" href="../../index.html">← Back to games</a>

<main class="app">
  <header>
    <h1 class="title">NEON<span>FOUR</span></h1>
    <p class="tagline">Line up four before the machine does</p>
  </header>

  <section class="scoreboard" aria-label="Score">
    <div class="score you"><span class="label">You</span><span class="val" id="scoreYou">0</span></div>
    <div class="score draw"><span class="label">Draws</span><span class="val" id="scoreDraw">0</span></div>
    <div class="score ai"><span class="label">AI</span><span class="val" id="scoreAi">0</span></div>
  </section>

  <section class="controls">
    <div class="seg" role="radiogroup" aria-label="AI difficulty">
      <button role="radio" data-diff="easy">Easy</button>
      <button role="radio" data-diff="medium">Medium</button>
      <button role="radio" data-diff="hard">Hard</button>
    </div>
    <div class="actions">
      <button id="hintBtn" title="Show the best move (H)">Hint</button>
      <button id="soundBtn" title="Toggle sound (M)">Sound</button>
      <button id="newBtn" title="Start a new round (N)">New round</button>
    </div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="board-wrap">
    <div class="preview" id="preview" aria-hidden="true"></div>
    <div class="board" id="board" aria-label="Connect Four board, 7 columns by 6 rows"></div>
  </div>

  <p class="help">
    Click a column, or use <kbd>←</kbd> <kbd>→</kbd> + <kbd>Enter</kbd> · <kbd>1</kbd>–<kbd>7</kbd> drop ·
    <kbd>H</kbd> hint · <kbd>N</kbd> new round. Who moves first alternates each round.
  </p>
  <button id="resetScores" class="link">Reset scores</button>
</main>

<script>
(function () {
  'use strict';

  /* =====================================================================
     Constants & board geometry
     Cells are stored bottom-up: index = row * COLS + col, row 0 = bottom.
     ===================================================================== */
  var ROWS = 6, COLS = 7, SIZE = ROWS * COLS;
  var EMPTY = 0, HUMAN = 1, AI = 2;
  var ORDER = [3, 2, 4, 1, 5, 0, 6];         // center-first move ordering
  var WIN_SCORE = 1000000;
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  var DIFFICULTY = {
    easy:   { depth: 2, blunder: 0.4 },
    medium: { depth: 5, blunder: 0.08 },
    hard:   { depth: 9, blunder: 0 }
  };
  var HINT_DEPTH = 8;
  var STORE_KEY = 'neonFour.v1';

  function at(r, c) { return r * COLS + c; }

  // Every possible 4-in-a-row window (69 of them), flattened for speed.
  var WINDOWS = (function () {
    var list = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        for (var d = 0; d < DIRS.length; d++) {
          var dr = DIRS[d][0], dc = DIRS[d][1];
          var er = r + 3 * dr, ec = c + 3 * dc;
          if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
          for (var k = 0; k < 4; k++) list.push(at(r + k * dr, c + k * dc));
        }
      }
    }
    return new Uint8Array(list);
  })();

  /* =====================================================================
     Rules
     ===================================================================== */

  // Returns the winning line through (r, c) as [[r, c], ...], or null.
  function findWin(cells, r, c, p) {
    for (var d = 0; d < DIRS.length; d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1];
      var line = [[r, c]];
      for (var s = -1; s <= 1; s += 2) {
        var rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && cells[at(rr, cc)] === p) {
          line.push([rr, cc]);
          rr += dr * s; cc += dc * s;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  // Allocation-free version for the search.
  function isWin(cells, r, c, p) {
    for (var d = 0; d < 4; d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1], n = 1;
      var rr = r + dr, cc = c + dc;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && cells[rr * COLS + cc] === p) { n++; rr += dr; cc += dc; }
      rr = r - dr; cc = c - dc;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && cells[rr * COLS + cc] === p) { n++; rr -= dr; cc -= dc; }
      if (n >= 4) return true;
    }
    return false;
  }

  /* =====================================================================
     AI: negamax (minimax) with alpha-beta pruning and depth limit
     ===================================================================== */

  // Static evaluation from player p's point of view.
  function evaluate(b, p) {
    var o = 3 - p, score = 0, i, v;
    for (var r = 0; r < ROWS; r++) {
      v = b[r * COLS + 3];
      if (v === p) score += 3; else if (v === o) score -= 3;
    }
    for (i = 0; i < WINDOWS.length; i += 4) {
      var mine = 0, theirs = 0;
      for (var k = 0; k < 4; k++) {
        v = b[WINDOWS[i + k]];
        if (v === p) mine++; else if (v === o) theirs++;
      }
      if (mine && theirs) continue;          // dead window
      if (mine === 3) score += 5;
      else if (mine === 2) score += 2;
      else if (theirs === 3) score -= 5;
      else if (theirs === 2) score -= 2;
    }
    return score;
  }

  function negamax(b, h, depth, alpha, beta, p, filled) {
    if (filled === SIZE) return 0;
    if (depth === 0) return evaluate(b, p);
    var best = -Infinity;
    for (var i = 0; i < COLS; i++) {
      var c = ORDER[i], r = h[c];
      if (r >= ROWS) continue;
      b[r * COLS + c] = p; h[c]++;
      // Wins found with more depth remaining are sooner, so they score higher.
      var score = isWin(b, r, c, p)
        ? WIN_SCORE + depth
        : -negamax(b, h, depth - 1, -beta, -alpha, 3 - p, filled + 1);
      b[r * COLS + c] = EMPTY; h[c]--;
      if (score > best) best = score;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  // Best column for player p; ties are broken randomly for variety.
  function searchBest(cells, heights, p, depth) {
    var b = Int8Array.from(cells), h = Int8Array.from(heights);
    var filled = 0;
    for (var c0 = 0; c0 < COLS; c0++) filled += h[c0];
    var bestScore = -Infinity, best = [];
    for (var i = 0; i < COLS; i++) {
      var c = ORDER[i], r = h[c];
      if (r >= ROWS) continue;
      b[r * COLS + c] = p; h[c]++;
      // Window [bestScore - 1, +inf) keeps tied scores exact so ties are detected.
      var score = isWin(b, r, c, p)
        ? WIN_SCORE + depth
        : -negamax(b, h, depth - 1, -Infinity, -(bestScore - 1), 3 - p, filled + 1);
      b[r * COLS + c] = EMPTY; h[c]--;
      if (score > bestScore) { bestScore = score; best = [c]; }
      else if (score === bestScore) best.push(c);
    }
    return best[Math.floor(Math.random() * best.length)];
  }

  function legalCols(heights) {
    var cols = [];
    for (var c = 0; c < COLS; c++) if (heights[c] < ROWS) cols.push(c);
    return cols;
  }

  function immediateWin(cells, heights, p) {
    var b = Int8Array.from(cells);
    for (var c = 0; c < COLS; c++) {
      var r = heights[c];
      if (r >= ROWS) continue;
      b[r * COLS + c] = p;
      if (isWin(b, r, c, p)) return c;
      b[r * COLS + c] = EMPTY;
    }
    return -1;
  }

  function pickAIMove(cells, heights, difficulty) {
    var cfg = DIFFICULTY[difficulty];
    var win = immediateWin(cells, heights, AI);
    if (win >= 0) return win;
    if (Math.random() < cfg.blunder) {
      var cols = legalCols(heights);
      return cols[Math.floor(Math.random() * cols.length)];
    }
    return searchBest(cells, heights, AI, cfg.depth);
  }

  /* =====================================================================
     Persistence (best-effort; the game works without it)
     ===================================================================== */
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveStore() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        scores: state.scores, difficulty: state.difficulty, sound: sfx.on
      }));
    } catch (e) { /* storage unavailable */ }
  }

  /* =====================================================================
     Sound (Web Audio synth blips, no assets)
     ===================================================================== */
  var sfx = (function () {
    var ctx = null;
    var api = { on: true };
    function audio() {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, dur, opts) {
      if (!api.on || !ctx) return;
      opts = opts || {};
      var t = ctx.currentTime + (opts.delay || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = opts.type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (opts.slide) o.frequency.exponentialRampToValueAtTime(freq * opts.slide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(opts.vol || 0.12, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    }
    api.unlock = audio;
    api.drop = function (row, p) {
      tone((p === HUMAN ? 240 : 170) + row * 22, 0.2, { type: 'triangle', vol: 0.22, slide: 0.45 });
      tone(p === HUMAN ? 1320 : 990, 0.05, { type: 'square', vol: 0.025 });
    };
    api.tick = function () { tone(720, 0.035, { type: 'square', vol: 0.02 }); };
    api.error = function () { tone(110, 0.14, { type: 'sawtooth', vol: 0.06 }); };
    api.hint = function () { tone(880, 0.12, { vol: 0.08 }); tone(1320, 0.16, { vol: 0.06, delay: 0.08 }); };
    api.win = function () {
      [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.28, { type: 'triangle', vol: 0.14, delay: i * 0.08 }); });
    };
    api.lose = function () {
      [392, 311, 262, 196].forEach(function (f, i) { tone(f, 0.32, { type: 'sawtooth', vol: 0.05, delay: i * 0.12, slide: 0.97 }); });
    };
    api.draw = function () { tone(440, 0.25, { type: 'triangle', vol: 0.1 }); tone(440, 0.25, { type: 'triangle', vol: 0.1, delay: 0.18 }); };
    return api;
  })();

  /* =====================================================================
     State
     ===================================================================== */
  var stored = loadStore();
  var state = {
    cells: new Int8Array(SIZE),
    heights: new Int8Array(COLS),
    filled: 0,
    turn: HUMAN,
    starter: HUMAN,
    round: 1,
    over: false,
    busy: false,
    token: 0,                 // bumps on new round; stale timeouts bail out
    hoverCol: -1,
    keyCol: 3,
    hintCol: -1,
    difficulty: DIFFICULTY[stored.difficulty] ? stored.difficulty : 'medium',
    scores: Object.assign({ you: 0, ai: 0, draw: 0 }, stored.scores)
  };
  if (stored.sound === false) sfx.on = false;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =====================================================================
     DOM
     ===================================================================== */
  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board'), previewEl = $('preview'), statusEl = $('status');
  var hintBtn = $('hintBtn'), soundBtn = $('soundBtn'), newBtn = $('newBtn');
  var diffBtns = Array.prototype.slice.call(document.querySelectorAll('[data-diff]'));
  var cellEls = new Array(SIZE), discEls = new Array(SIZE), slotEls = [], ghostEls = [];

  (function buildBoard() {
    for (var c = 0; c < COLS; c++) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.col = c;
      var ghost = document.createElement('div');
      ghost.className = 'ghost p1';
      slot.appendChild(ghost);
      previewEl.appendChild(slot);
      slotEls.push(slot); ghostEls.push(ghost);
    }
    // DOM order is top row first; later cells paint over earlier ones,
    // so a falling disc passes over the empty sockets above it.
    for (var rt = 0; rt < ROWS; rt++) {
      var r = ROWS - 1 - rt;
      for (var c2 = 0; c2 < COLS; c2++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.col = c2;
        var disc = document.createElement('div');
        disc.className = 'disc';
        cell.appendChild(disc);
        boardEl.appendChild(cell);
        cellEls[at(r, c2)] = cell;
        discEls[at(r, c2)] = disc;
      }
    }
  })();

  function humanCanAct() {
    return !state.over && !state.busy && state.turn === HUMAN;
  }

  function forColumn(c, fn) {
    for (var r = 0; r < ROWS; r++) fn(cellEls[at(r, c)], r);
  }

  function setHover(c) {
    if (state.hoverCol >= 0) {
      forColumn(state.hoverCol, function (el) { el.classList.remove('hl', 'land'); });
      slotEls[state.hoverCol].classList.remove('show');
    }
    state.hoverCol = c;
    if (c < 0 || !humanCanAct()) return;
    forColumn(c, function (el, r) {
      el.classList.add('hl');
      if (r === state.heights[c]) el.classList.add('land');
    });
    ghostEls[c].className = 'ghost p1';
    slotEls[c].classList.add('show');
  }

  // Shows the AI "ghost" hovering over a column while it moves in.
  function showAIGhost(c) {
    slotEls.forEach(function (s) { s.classList.remove('show'); });
    if (c < 0) return;
    ghostEls[c].className = 'ghost p2';
    slotEls[c].classList.add('show');
  }

  function clearHint() {
    if (state.hintCol < 0) return;
    forColumn(state.hintCol, function (el) { el.classList.remove('hint'); });
    slotEls[state.hintCol].classList.remove('hint');
    state.hintCol = -1;
  }

  function setStatus(kind, text, sub) {
    statusEl.className = 'status' + (kind === 'win' || kind === 'lose' || kind === 'draw' ? ' ' + kind : '');
    var dot = '';
    if (kind === 'you') dot = '<span class="dot p1"></span>';
    else if (kind === 'ai') dot = '<span class="dot p2 thinking"></span>';
    statusEl.innerHTML = dot + '<span>' + text + '</span>' + (sub ? '<span class="sub">' + sub + '</span>' : '');
  }

  function renderScores(bumpKey) {
    var map = { you: $('scoreYou'), ai: $('scoreAi'), draw: $('scoreDraw') };
    Object.keys(map).forEach(function (k) {
      map[k].textContent = state.scores[k];
      if (k === bumpKey) {
        map[k].classList.remove('bump');
        void map[k].offsetWidth;
        map[k].classList.add('bump');
      }
    });
  }

  function renderControls() {
    diffBtns.forEach(function (b) {
      b.setAttribute('aria-checked', String(b.dataset.diff === state.difficulty));
    });
    soundBtn.textContent = 'Sound: ' + (sfx.on ? 'On' : 'Off');
    hintBtn.disabled = !humanCanAct();
    var locked = !humanCanAct();
    boardEl.classList.toggle('locked', locked);
    previewEl.classList.toggle('locked', locked);
    newBtn.classList.toggle('ready', state.over);
    newBtn.textContent = state.over ? 'Play again' : 'New round';
  }

  function roundLabel() {
    return 'Round ' + state.round;
  }

  /* =====================================================================
     Game flow
     ===================================================================== */
  function newRound(first) {
    state.token++;
    state.cells.fill(EMPTY);
    state.heights.fill(0);
    state.filled = 0;
    state.over = false;
    state.busy = false;
    if (!first) state.round++;
    state.turn = state.starter;
    clearHint();
    discEls.forEach(function (d) { d.className = 'disc'; d.removeAttribute('style'); });
    boardEl.classList.remove('over');
    showAIGhost(-1);
    if (state.turn === AI) {
      aiTurn();
    } else {
      setStatus('you', 'Your move', roundLabel() + ' · you open');
      renderControls();
      setHover(state.hoverCol);
    }
  }

  function playMove(c, p) {
    var r = state.heights[c];
    var token = state.token;
    state.cells[at(r, c)] = p;
    state.heights[c]++;
    state.filled++;
    state.busy = true;
    clearHint();
    setHover(-1);
    showAIGhost(-1);
    renderControls();

    var disc = discEls[at(r, c)];
    var fall = ROWS - r;                       // rows between the preview slot and the landing socket
    var dur = reduceMotion ? 120 : 240 + fall * 55;
    disc.className = 'disc p' + p;
    disc.style.setProperty('--n', fall);
    disc.style.setProperty('--dur', dur + 'ms');
    void disc.offsetWidth;                     // restart animation
    disc.classList.add('drop');

    setTimeout(function () { if (token === state.token) sfx.drop(r, p); }, dur * 0.72);
    setTimeout(function () {
      if (token !== state.token) return;
      disc.classList.remove('drop');
      afterMove(r, c, p);
    }, dur);
  }

  function afterMove(r, c, p) {
    var line = findWin(state.cells, r, c, p);
    if (line) return endRound(p, line);
    if (state.filled === SIZE) return endRound(EMPTY, null);
    state.turn = 3 - p;
    state.busy = false;
    if (state.turn === AI) {
      aiTurn();
    } else {
      setStatus('you', 'Your move', roundLabel());
      renderControls();
      setHover(state.hoverCol);
    }
  }

  function aiTurn() {
    var token = state.token;
    state.busy = true;
    setStatus('ai', 'AI computing', roundLabel());
    renderControls();
    // Let the "computing" state paint before the (synchronous) search runs.
    setTimeout(function () {
      if (token !== state.token) return;
      var col = pickAIMove(state.cells, state.heights, state.difficulty);
      // Sweep the AI ghost across a couple of columns before it commits.
      var path = [];
      for (var i = 0; i < 2; i++) path.push(Math.floor(Math.random() * COLS));
      path.push(col);
      var step = 0;
      (function next() {
        if (token !== state.token) return;
        if (step < path.length) {
          showAIGhost(path[step++]);
          sfx.tick();
          setTimeout(next, reduceMotion ? 40 : 130);
        } else {
          playMove(col, AI);
        }
      })();
    }, 60);
  }

  function endRound(winner, line) {
    state.over = true;
    state.busy = false;
    setHover(-1);
    if (winner === HUMAN) {
      state.scores.you++;
      setStatus('win', 'You win — four connected', roundLabel());
      sfx.win();
      renderScores('you');
    } else if (winner === AI) {
      state.scores.ai++;
      setStatus('lose', 'The machine wins', roundLabel());
      sfx.lose();
      renderScores('ai');
    } else {
      state.scores.draw++;
      setStatus('draw', 'Grid locked — draw', roundLabel());
      sfx.draw();
      renderScores('draw');
    }
    if (line) {
      boardEl.classList.add('over');
      line.forEach(function (rc) { discEls[at(rc[0], rc[1])].classList.add('win'); });
    }
    state.starter = 3 - state.starter;         // alternate who opens
    saveStore();
    renderControls();
  }

  function humanPlay(c) {
    if (!humanCanAct()) return;
    if (c < 0 || c >= COLS) return;
    if (state.heights[c] >= ROWS) {
      sfx.error();
      boardEl.classList.remove('shake');
      void boardEl.offsetWidth;
      boardEl.classList.add('shake');
      return;
    }
    state.keyCol = c;
    playMove(c, HUMAN);
  }

  function showHint() {
    if (!humanCanAct()) return;
    clearHint();
    var c = searchBest(state.cells, state.heights, HUMAN, HINT_DEPTH);
    state.hintCol = c;
    forColumn(c, function (el, r) { if (r === state.heights[c]) el.classList.add('hint'); });
    ghostEls[c].className = 'ghost p1';
    slotEls[c].classList.add('hint', 'show');
    sfx.hint();
  }

  /* =====================================================================
     Input
     ===================================================================== */
  function colFromEvent(e) {
    var el = e.target.closest('[data-col]');
    return el ? Number(el.dataset.col) : -1;
  }

  [boardEl, previewEl].forEach(function (el) {
    el.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse') return;
      var c = colFromEvent(e);
      if (c !== state.hoverCol) setHover(c);
    });
    el.addEventListener('pointerleave', function () { setHover(-1); });
    el.addEventListener('click', function (e) {
      var c = colFromEvent(e);
      if (c >= 0) humanPlay(c);
    });
  });

  document.addEventListener('pointerdown', sfx.unlock, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    sfx.unlock();
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault();
      state.keyCol = (state.keyCol + (k === 'ArrowLeft' ? COLS - 1 : 1)) % COLS;
      setHover(state.keyCol);
    } else if ((k === 'Enter' || k === ' ' || k === 'ArrowDown') && document.activeElement.tagName !== 'BUTTON') {
      e.preventDefault();
      humanPlay(state.hoverCol >= 0 ? state.hoverCol : state.keyCol);
    } else if (k >= '1' && k <= '7') {
      humanPlay(Number(k) - 1);
    } else if (k === 'h' || k === 'H') {
      showHint();
    } else if (k === 'n' || k === 'N') {
      newRound(false);
    } else if (k === 'm' || k === 'M') {
      soundBtn.click();
    }
  });

  diffBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      state.difficulty = b.dataset.diff;
      saveStore();
      renderControls();
    });
  });

  hintBtn.addEventListener('click', showHint);
  newBtn.addEventListener('click', function () { newRound(false); });
  soundBtn.addEventListener('click', function () {
    sfx.on = !sfx.on;
    if (sfx.on) { sfx.unlock(); sfx.tick(); }
    saveStore();
    renderControls();
  });
  $('resetScores').addEventListener('click', function () {
    state.scores = { you: 0, ai: 0, draw: 0 };
    saveStore();
    renderScores();
  });

  // Exposed for headless testing / debugging.
  window.NeonFour = {
    state: state,
    searchBest: searchBest,
    pickAIMove: pickAIMove,
    findWin: findWin,
    play: humanPlay
  };

  renderScores();
  newRound(true);
})();
</script>
</body>
</html>
