<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jam Tunnel — level check</title>
  <style>
    body { font: 14px ui-monospace, Menlo, monospace; background: #111; color: #eee; padding: 20px; }
    td, th { padding: 4px 12px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    .warn { color: #ffb36b; }
  </style>
</head>
<body>
  <h1>Level check</h1>
  <p>Renders one loop of every genre (top suggestion for each layer) offline and measures loudness.
     Genres should land within about 3 dB of each other, and no layer should be inaudible.</p>
  <table id="out"><tr><th>genre / layer</th><th>RMS dBFS</th><th>peak</th></tr></table>

  <script src="../grooves.js"></script>
  <script src="../theory.js"></script>
  <script src="../genres.js"></script>
  <script src="../audio.js"></script>
  <script>
  // Render one loop offline. sounds: { role: voice } overrides; onlyRole renders that part alone.
  async function render(genreId, sounds, onlyRole) {
    const song = JT.newSong(genreId, 12345);
    JT.ROLES.forEach(role => {
      const o = JT.suggest(song, role, 1)[0];
      song.layers[role] = { styleId: o.style.id, seed: o.seed, busy: 1, notes: o.notes };
    });
    const g = JT.GENRES[genreId];
    const voice = r => (sounds && sounds[r]) || g.roles[r].voice;
    const spb = 60 / song.bpm;
    const ctx = new OfflineAudioContext(2, Math.ceil((16 * spb + 1) * 44100), 44100);
    const audio = JT.createAudio(ctx, { samplesBase: '../samples/' });
    if (!onlyRole) audio.setTrim(g.trim);
    const roles = JT.ROLES.filter(r => !onlyRole || r === onlyRole);
    await audio.load(roles.map(r => JT.instOf(voice(r))));
    audio.schedule(roles.map(r => ({ role: r, voice: voice(r), notes: song.layers[r].notes, lead: r === 'lead' })), 0, 16, 0.05, spb, 16);
    const buf = await ctx.startRendering();
    let sum = 0, peak = 0, n = 0;
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) { sum += d[i] * d[i]; peak = Math.max(peak, Math.abs(d[i])); n++; }
    }
    return { rms: 20 * Math.log10(Math.sqrt(sum / n) + 1e-9), peak };
  }
  (async () => {
    const rows = [];
    for (const id of Object.keys(JT.GENRES)) {
      const g = JT.GENRES[id];
      rows.push([g.name, await render(id)]);
      for (const role of JT.ROLES) {
        const sounds = g.roles[role].sounds || [{ id: g.roles[role].voice, name: g.roles[role].label }];
        for (const snd of sounds) rows.push(['  ' + role + ': ' + snd.name, await render(id, { [role]: snd.id }, role)]);
      }
    }
    const table = document.getElementById('out');
    rows.forEach(([name, r]) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${name}</td><td class="${r.rms < -40 ? 'warn' : ''}">${r.rms.toFixed(1)}</td><td>${r.peak.toFixed(2)}</td>`;
      table.appendChild(tr);
    });
    window.levels = rows.map(([name, r]) => `${name.padEnd(30)} ${r.rms.toFixed(1).padStart(6)} dB  peak ${r.peak.toFixed(2)}`).join('\n');
  })();
  </script>
</body>
</html>
