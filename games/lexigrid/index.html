<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiGrid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Home Screen -->
  <div id="screen-home" class="screen">
    <div class="screen-wrapper">
      <a class="hub-back" href="../../index.html">&larr; Browser Games</a>
      <h1>LexiGrid</h1>
      <div class="daily-card">
        <div class="daily-card__header">
          <span class="daily-card__date"></span>
          <span class="difficulty-badge" data-level="1"></span>
        </div>
        <h2 class="daily-card__title"></h2>
        <a class="btn-play" role="button" href="#">Play Today's Puzzle</a>
      </div>
      <a class="library-link" href="#">Browse all puzzles &rarr;</a>
    </div>
  </div>

  <!-- Library Screen -->
  <div id="screen-library" class="screen">
    <div class="screen-wrapper">
      <a class="back-link" href="#">&larr; Home</a>
      <h2 class="screen-title">Puzzle Library</h2>
      <div id="library-sections"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="screen-game" class="screen">
    <div class="screen-wrapper">
      <div id="score-bar">
        <span class="score-label">Score:</span>
        <span id="score-value">0</span>
        <span class="words-label">Words:</span>
        <span id="words-count">0</span>
        <div id="found-words-list" aria-live="polite"></div>
        <button id="btn-hc" aria-pressed="false" aria-label="Toggle high contrast">HC</button>
      </div>
      <div id="grid"></div>
      <div id="tray"></div>
      <div id="game-controls">
        <button id="btn-undo" disabled>Undo</button>
        <button id="btn-reset">Reset</button>
      </div>
    </div>
  </div>

  <!-- Results Screen -->
  <div id="screen-results" class="screen">
    <div class="screen-wrapper">
      <div class="postcard">
        <div class="postcard__header">
          <p class="postcard__title"></p>
          <div class="postcard__stamp">
            <span class="stamp-inner">
              <span>LEXI</span><span>GRID</span>
            </span>
          </div>
        </div>
        <div class="postcard__score-block"></div>
        <div class="postcard__words">
          <p class="postcard__words-label">Words found:</p>
          <p class="postcard__words-list"></p>
        </div>
        <div class="postcard__actions">
          <button class="btn-copy">Copy to Share</button>
          <button class="btn-play-again">Play Again</button>
          <button class="btn-home">Home</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Designer Screen (Phase 37) -->
  <div id="screen-designer" class="screen">
    <div class="screen-wrapper">
      <a class="back-link" id="btn-designer-back" href="#">Home</a>
      <h2 class="screen-title">Puzzle Designer</h2>

      <div class="designer-section">
        <label for="designer-grid">Grid</label>
        <div class="designer-grid" id="designer-grid"></div>
      </div>

      <div class="designer-section">
        <label for="designer-title">Title</label>
        <input type="text" id="designer-title" placeholder="Puzzle title" />

        <label for="designer-difficulty">Difficulty</label>
        <select id="designer-difficulty">
          <option value="1" selected>Easy</option>
          <option value="2">Medium</option>
          <option value="3">Hard</option>
        </select>

        <label for="designer-tray">Tray Letters</label>
        <input type="text" id="designer-tray" placeholder="A,B,C,D,E,F,G" />

        <label for="designer-words">Word List</label>
        <textarea id="designer-words" rows="6" placeholder="One word per line"></textarea>

        <label for="designer-dedication">Dedication (optional)</label>
        <input type="text" id="designer-dedication" placeholder="Optional dedication" />
      </div>

      <div class="designer-actions">
        <button id="btn-compute">Compute Max Score</button>
      </div>

      <div id="designer-feedback"></div>

      <pre id="designer-output">Fill in the grid and word list, then click Compute Max Score.</pre>

      <div class="designer-actions">
        <button id="btn-copy-json">Copy JSON</button>
        <button id="btn-play-test">Play Test</button>
      </div>
    </div>
  </div>

  <script src="dictionary.js"></script>
  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
