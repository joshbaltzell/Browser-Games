<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pond Chorus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back" href="../../index.html">← Back to games</a>
<canvas id="game"></canvas>

<div id="panel" aria-label="Sequencer">
  <p id="caption" class="caption"></p>
  <div class="controls-row">
    <div class="hush" id="hush"><span class="hush-dots" id="hushDots"></span><span class="hush-label">Hush</span></div>
    <div class="songbox" id="songbox">
      <input type="text" id="codeIn" placeholder="Paste a song code" aria-label="Song code" autocomplete="off" spellcheck="false">
      <button type="button" id="btnLoad" class="small tiny">Load</button>
      <button type="button" id="btnCopy" class="small tiny">Copy code</button>
    </div>
    <div class="btns">
      <button type="button" id="btnSkip" class="small skip">Skip demo</button>
      <button type="button" id="btnPlay" class="small">Pause</button>
      <button type="button" id="btnRestart" class="small">Restart</button>
    </div>
  </div>
  <div class="action-row" id="actionRow">
    <div class="act-l">
      <button type="button" id="btnHint" class="small act-compose" title="Show one note of a good song">Hint</button>
      <button type="button" id="btnTest" class="small act-compose" title="Try your song against the wave. Nothing is saved.">Test</button>
      <button type="button" id="btnSpeed" class="small act-watch" aria-pressed="false">Speed 2x</button>
    </div>
    <span id="readyWhy" class="ready-why" aria-live="polite"></span>
    <button type="button" id="btnReady" class="ready act-compose">Ready: let it rip</button>
  </div>
  <div class="grid" id="grid"><div class="playhead" id="playhead"></div></div>
</div>

<div id="title" class="overlay title">
  <div class="title-art" aria-hidden="true">
    <img class="deco owl" src="assets/owl-idle.png" alt="" onerror="this.style.display='none'">
    <img class="deco jar" src="assets/jar-glow.png" alt="" onerror="this.style.display='none'">
    <div class="deco frogwrap"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><img src="assets/frog-sing.png" alt="" onerror="this.style.display='none'"></div>
  </div>
  <h1>Pond Chorus</h1>
  <p class="goal">Make your song first, then watch it defend the pond. A good groove hits harder.</p>
  <p class="controls">Tap or click a pad to switch a note. Space plays and pauses.</p>
  <div class="title-buttons">
    <button id="start" type="button" class="big">Start</button>
    <button id="jam" type="button" class="big alt">Just jam</button>
  </div>
  <div class="night-chips" id="chips"></div>
  <p class="nightof" id="nightof">Night 1 of 9</p>
</div>

<div id="intro" class="overlay intro hidden" role="dialog" aria-live="polite">
  <div class="card">
    <img id="introImg" class="intro-img" src="" alt="">
    <h2 id="introName"></h2>
    <p id="introRole" class="intro-role"></p>
    <p id="introLine" class="resline"></p>
    <div class="res-buttons">
      <button type="button" id="introHear" class="big alt">Hear it</button>
      <button type="button" id="introGo" class="big">Got it</button>
    </div>
  </div>
</div>

<div id="results" class="overlay results hidden" role="dialog" aria-live="polite">
  <div class="card">
    <h2 id="resTitle"></h2>
    <p id="resStars" class="stars"></p>
    <p id="resLine" class="resline"></p>
    <p id="resGroove" class="groove-line"></p>
    <p id="resQuiet" class="quiet"></p>
    <div class="res-buttons">
      <button type="button" id="resNext" class="big"></button>
      <button type="button" id="resCode" class="big alt">Copy song code</button>
      <button type="button" id="resAgain" class="big alt">Try again</button>
      <button type="button" id="resTitleBtn" class="big alt">Title</button>
    </div>
  </div>
</div>

<script src="../kit/kit.js"></script>
<script src="../kit/rig.js"></script>
<script src="assets/manifest.js"></script>
<script src="sim.js"></script>
<script src="levels.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
