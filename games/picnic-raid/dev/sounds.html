<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picnic Raid sounds</title>
<style>body { font-family: system-ui, sans-serif; background: #14161c; color: #eee; padding: 16px; }</style>
</head>
<body>
<h1>Picnic Raid sounds</h1>
<p>One button per sound. The bar shows the loudest level so far; keep it under -3 dB.</p>
<div id="board"></div>
<script src="../../kit/kit.js"></script>
<script src="../audio.js"></script>
<script>Kit.soundBoard(SOUNDS, document.getElementById('board'));
// extra buttons: the result arpeggio grows with the score
(function () {
  var wrap = document.createElement('div'); wrap.style.marginTop = '16px';
  [1, 4, 8, 12].forEach(function (n) {
    var b = document.createElement('button'); b.textContent = 'result, ' + n + ' bites'; b.style.margin = '4px'; b.style.padding = '8px 12px';
    b.onclick = function () { Kit.audio.unlock(); play('result', { count: n }); };
    wrap.appendChild(b);
  });
  document.body.appendChild(wrap);
})();</script>
</body>
</html>
