<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mabel &amp; the Mabels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back" href="../../index.html">← Back to games</a>
<canvas id="game"></canvas>
<div id="title" class="overlay">
  <h1><span>Mabel &amp; the Mabels</span></h1>
  <p class="goal"><span>Grumps walk in to stop your music. Play notes to charm them into fans.</span></p>
  <p class="goal sub"><span>Fans toss coins. 10 coins hires a band member. The set lasts 90 seconds.</span></p>
  <p class="controls"><span>Tap Space on the tick. Move with WASD. On touch: tap right on the tick, drag left to move.</span></p>
  <button id="start" type="button"><span>Play</span></button>
</div>
<div id="end" class="overlay hidden">
  <h1><span id="endTitle">Set survived</span></h1>
  <p class="goal"><span id="endStats"></span></p>
  <button id="again" type="button"><span>Play again</span></button>
</div>
<script src="../kit/kit.js"></script>
<script src="assets/manifest.js"></script>
<script src="sim.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="../kit/device-notice.js" data-play="landscape"></script>
</body>
</html>
