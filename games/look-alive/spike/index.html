<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Look Alive: render spike</title>
<style>
  html,body{margin:0;height:100%;background:#02040a;color:#b9c7e0;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  #panel{position:fixed;left:8px;top:8px;width:268px;max-height:calc(100% - 16px);overflow:auto;background:rgba(6,10,22,.82);border:1px solid #1e2a48;border-radius:6px;padding:8px 10px}
  #panel h1{font-size:13px;margin:0 0 6px;color:#e8f0ff}
  #panel label{display:block;margin:6px 0 2px;color:#8da2c8}
  #panel input[type=range],#panel select{width:100%}
  #panel button{background:#16213d;color:#dbe6ff;border:1px solid #2b3d6b;border-radius:4px;padding:4px 8px;margin:4px 4px 0 0;font:inherit;cursor:pointer}
  #panel button:hover{background:#1d2c52}
  #panel .row{display:flex;gap:10px;align-items:center;margin-top:5px}
  #panel .row label{margin:0;display:inline}
  #panel hr{border:0;border-top:1px solid #1e2a48;margin:8px 0}
  #read{position:fixed;right:8px;top:8px;background:rgba(6,10,22,.82);border:1px solid #1e2a48;border-radius:6px;padding:8px 10px;white-space:pre;min-width:250px}
  #msg{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(40,16,8,.9);border:1px solid #6b3b2b;border-radius:6px;padding:6px 12px;color:#ffd7b8;display:none;max-width:70%}
  #bench{margin-top:6px;white-space:pre;color:#cfe0ff;font-size:11px}
  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px}
  .small{color:#6f84ad;font-size:11px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="nogl"></div>
<div id="panel">
  <h1>Look Alive: render spike</h1>
  <label>Visible microbe cap: <b id="capV"></b></label>
  <input id="cap" type="range" min="0" max="100" value="38">
  <label>Grid size</label>
  <select id="grid"><option>128</option><option selected>256</option><option>512</option></select>
  <label>Sim speed: <b id="spdV"></b> tick(s)/frame</label>
  <input id="spd" type="range" min="0" max="20" value="1">
  <div><button id="run300">Run 300 ticks now</button><button id="reset">Reset world</button><button id="home">Reset view</button></div>
  <div id="runOut" class="small"></div>
  <div class="row"><input id="rec" type="checkbox" checked><label for="rec">history + snapshots</label></div>
  <label>Snapshot every N ticks (0 = off): <b id="snV"></b></label>
  <input id="sn" type="range" min="0" max="50" value="10">
  <hr>
  <div class="row"><input id="bloom" type="checkbox" checked><label for="bloom">bloom</label>
    <input id="band" type="checkbox"><label for="band">normal band overlay</label></div>
  <label>Disguise slip: <b id="slipV"></b></label>
  <input id="slip" type="range" min="0" max="100" value="60">
  <div class="row"><input id="auto" type="checkbox" checked><label for="auto">auto quality fallback</label></div>
  <hr>
  <label>Replay scrubber: <b id="scrV">no snapshots</b></label>
  <input id="scr" type="range" min="0" max="0" value="0">
  <div><button id="resume">Resume from here</button></div>
  <hr>
  <div><button id="benchBtn">Run benchmark</button><button id="copyBtn">Copy results</button></div>
  <div id="bench"></div>
  <div class="small">Wheel / pinch: zoom. Drag: pan. Zoom in past ~5 px per cell to see individuals.</div>
</div>
<div id="read"></div>
<div id="msg"></div>
<script src="field.js"></script>
<script src="render.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv');
  var R = LARender.create(cv);
  if (R.error) { var ng = $('nogl'); ng.style.display = 'flex'; ng.textContent = R.error + ' This spike needs WebGL2 (try a current Chrome, Edge, Firefox or Safari).'; $('panel').style.display = 'none'; $('read').style.display = 'none'; return; }

  var S = { N: 256, field: null, cx: 128, cy: 128, zoom: 3, cap: 20000, spt: 1, bloom: true, band: false, slip: 0.6, auto: true,
    simMs: 0, simTicks: 0, snapMs: 0, bench: null, benchRows: [], lastBenchText: '', frames: [], lastT: 0, paused: false, scrubbing: false, strikes: 0, slowSince: 0, dprCap: 2 };

  function capFromSlider(v) { return Math.round(Math.exp(Math.log(1000) + (Math.log(200000) - Math.log(1000)) * v / 100) / 100) * 100; }
  function fmt(n) { return n.toLocaleString('en-US'); }
  function msg(t) { var m = $('msg'); m.textContent = t; m.style.display = t ? 'block' : 'none'; clearTimeout(msg.t); if (t) msg.t = setTimeout(function () { m.style.display = 'none'; }, 9000); }

  function newWorld(N) {
    S.N = N; S.field = LAField.create(N, 20260), S.field.record = $('rec').checked; S.field.snapInterval = +$('sn').value;
    S.field.snaps.length = 0; S.field.snapBytes = 0; S.field.snapCount = 0; S.field.snapMsTotal = 0;
    S.simMs = 0; S.simTicks = 0; refreshScrub();
    home();
  }
  function home() { S.cx = S.N / 2; S.cy = S.N / 2; S.zoom = Math.min(cv.clientWidth, cv.clientHeight) / S.N * 0.95; }
  function refreshScrub() {
    var n = S.field.snaps.length, sc = $('scr'); sc.max = Math.max(0, n - 1);
    if (!S.scrubbing) { sc.value = Math.max(0, n - 1); }
    $('scrV').textContent = n ? ('snapshot ' + sc.value + ' of ' + (n - 1) + ' (tick ' + S.field.snaps[Math.min(n - 1, sc.value | 0)].tick + ')') : 'no snapshots';
  }

  // ---- controls
  function syncLabels() {
    $('capV').textContent = fmt(S.cap); $('spdV').textContent = S.spt; $('slipV').textContent = S.slip.toFixed(2); $('snV').textContent = $('sn').value;
  }
  $('cap').oninput = function () { S.cap = capFromSlider(+this.value); S.strikes = 0; syncLabels(); };
  $('spd').oninput = function () { S.spt = +this.value; syncLabels(); };
  $('slip').oninput = function () { S.slip = this.value / 100; syncLabels(); };
  $('sn').oninput = function () { S.field.snapInterval = +this.value; syncLabels(); };
  $('rec').onchange = function () { S.field.record = this.checked; };
  $('bloom').onchange = function () { S.bloom = this.checked; };
  $('band').onchange = function () { S.band = this.checked; };
  $('auto').onchange = function () { S.auto = this.checked; };
  $('grid').onchange = function () { newWorld(+this.value); };
  $('reset').onclick = function () { newWorld(S.N); };
  $('home').onclick = home;
  $('scr').oninput = function () {
    var f = S.field, i = this.value | 0; if (!f.snaps[i]) return;
    S.scrubbing = true; $('spd').value = 0; S.spt = 0; syncLabels();
    f.restore(f.snaps[i]); refreshScrub();
  };
  $('resume').onclick = function () {
    S.scrubbing = false; S.field.discardAfter(S.field.tick); $('spd').value = 1; S.spt = 1; syncLabels(); refreshScrub();
  };

  function runResolve(n) {
    var f = S.field, t0 = performance.now(), s0 = f.snapMsTotal, c0 = f.snapCount;
    for (var i = 0; i < n; i++) f.step();
    var ms = performance.now() - t0, snaps = f.snapCount - c0;
    var res = { ticks: n, grid: S.N, totalMs: ms, msPerTick: ms / n, snapshots: snaps, snapMsTotal: f.snapMsTotal - s0, snapMB: f.snapMB(), record: f.record };
    $('runOut').textContent = n + ' ticks: ' + ms.toFixed(0) + ' ms (' + (ms / n).toFixed(2) + ' ms/tick), ' + snaps + ' snapshots, ' + f.snapMB().toFixed(1) + ' MB held';
    refreshScrub(); return res;
  }
  $('run300').onclick = function () { S.scrubbing = false; setTimeout(function () { runResolve(300); }, 20); $('runOut').textContent = 'running...'; };

  // ---- pan / zoom
  var ptrs = {}, lastPinch = 0;
  function pxPerWorld() { return S.zoom; }
  function zoomAt(mx, my, factor) {
    var w = cv.clientWidth, h = cv.clientHeight;
    var wx = S.cx + (mx - w / 2) / S.zoom, wy = S.cy - (my - h / 2) / S.zoom;
    S.zoom = Math.max(0.5, Math.min(220, S.zoom * factor));
    S.cx = wx - (mx - w / 2) / S.zoom; S.cy = wy + (my - h / 2) / S.zoom;
  }
  cv.addEventListener('wheel', function (e) { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  cv.addEventListener('pointerdown', function (e) { cv.setPointerCapture(e.pointerId); ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; cv.classList.add('drag'); lastPinch = 0; });
  cv.addEventListener('pointermove', function (e) {
    var p = ptrs[e.pointerId]; if (!p) return;
    var ids = Object.keys(ptrs);
    if (ids.length === 1) { S.cx -= (e.clientX - p.x) / S.zoom; S.cy += (e.clientY - p.y) / S.zoom; }
    p.x = e.clientX; p.y = e.clientY;
    if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastPinch) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / lastPinch);
      lastPinch = d;
    }
  });
  function up(e) { delete ptrs[e.pointerId]; lastPinch = 0; if (!Object.keys(ptrs).length) cv.classList.remove('drag'); }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // ---- benchmark
  var CAPS = [5000, 10000, 20000, 50000, 100000, 200000], BENCH_MS = 2000, BENCH_ZOOM = 12;
  function startBench() {
    if (S.bench) return;
    S.bench = { i: 0, t0: 0, samples: [], rows: [], saved: { cap: S.cap, zoom: S.zoom, cx: S.cx, cy: S.cy, spt: S.spt, auto: S.auto, bloom: S.bloom }, instSum: 0, buildSum: 0, gpuSum: 0, gpuN: 0, subSum: 0, n: 0, warm: 0 };
    S.auto = false; S.spt = 1; S.zoom = BENCH_ZOOM; S.cx = S.N / 2; S.cy = S.N / 2; S.cap = CAPS[0]; S.scrubbing = false;
    $('bench').textContent = 'benchmark running... (sim 1 tick/frame, zoom ' + BENCH_ZOOM + ' px/cell, bloom ' + (S.bloom ? 'on' : 'off') + ')'; syncLabels();
  }
  function benchFrame(dt, st) {
    var b = S.bench; if (!b) return;
    var t = performance.now();
    if (!b.t0) { b.t0 = t; }
    if (t - b.t0 < 300) return; // warm-up for this step
    b.samples.push(dt); b.instSum += st.instances; b.buildSum += st.buildMs; b.subSum += st.submitMs; if (st.gpuMs >= 0) { b.gpuSum += st.gpuMs; b.gpuN++; } b.n++;
    if (t - b.t0 >= BENCH_MS + 300) {
      var sum = 0, worst = 0, s = b.samples; for (var i = 0; i < s.length; i++) { sum += s[i]; if (s[i] > worst) worst = s[i]; }
      b.rows.push({ cap: CAPS[b.i], inst: Math.round(b.instSum / b.n), avg: sum / s.length, worst: worst, fps: 1000 / (sum / s.length), build: b.buildSum / b.n, submit: b.subSum / b.n, gpu: b.gpuN ? b.gpuSum / b.gpuN : -1, n: s.length });
      b.i++; b.samples = []; b.instSum = 0; b.buildSum = 0; b.gpuSum = 0; b.gpuN = 0; b.subSum = 0; b.n = 0; b.t0 = 0;
      if (b.i >= CAPS.length) endBench(); else S.cap = CAPS[b.i], syncLabels();
    }
  }
  function endBench() {
    var b = S.bench, sv = b.saved; S.bench = null;
    S.cap = sv.cap; S.zoom = sv.zoom; S.cx = sv.cx; S.cy = sv.cy; S.spt = sv.spt; S.auto = sv.auto; syncLabels();
    var L = ['Look Alive render spike benchmark', 'grid ' + S.N + ', dpr ' + R.dpr + ' (render scale ' + R.dprUsed + '), canvas ' + R.w + 'x' + R.h + ', bloom ' + (S.bloom ? 'on' : 'off') + ', zoom ' + BENCH_ZOOM + ' px/cell, sim 1 tick/frame',
      'gpu timer ext: ' + (R.hasGpuTimer ? 'yes' : 'no') + ', float targets: ' + (R.hdr ? 'yes' : 'no'), 'UA: ' + navigator.userAgent, '',
      'cap      drawn    avg ms  worst ms  fps    build ms  submit ms  gpu ms  frames'];
    b.rows.forEach(function (r) {
      L.push(String(r.cap).padEnd(9) + String(r.inst).padEnd(9) + r.avg.toFixed(1).padEnd(8) + r.worst.toFixed(1).padEnd(10) + r.fps.toFixed(0).padEnd(7) + r.build.toFixed(1).padEnd(10) + r.submit.toFixed(1).padEnd(11) + (r.gpu >= 0 ? r.gpu.toFixed(1) : 'n/a').padEnd(8) + r.n);
    });
    S.lastBenchText = L.join('\n'); $('bench').textContent = S.lastBenchText; S.benchRows = b.rows;
  }
  $('benchBtn').onclick = startBench;
  $('copyBtn').onclick = function () {
    var t = S.lastBenchText || 'no results yet'; var btn = this;
    function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy results'; }, 1500); }
    function fallback() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* ignore */ } document.body.removeChild(ta); done(); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback(); } catch (e) { fallback(); }
  };

  // ---- auto quality fallback: avg frame > 20 ms for 3 s -> halve cap (twice), then bloom off, then keep halving
  function autoQuality(avg, now) {
    if (!S.auto || S.bench || S.scrubbing && false) { S.slowSince = 0; return; }
    if (avg <= 20) { S.slowSince = 0; return; }
    if (!S.slowSince) { S.slowSince = now; return; }
    if (now - S.slowSince < 3000) return;
    S.slowSince = 0; S.strikes++;
    if ((S.strikes === 3 || S.cap <= 2000) && S.bloom) { S.bloom = false; $('bloom').checked = false; msg('Auto quality: frame time stayed above 20 ms, bloom turned off.'); }
    else if (S.cap > 1000) { S.cap = Math.max(1000, Math.round(S.cap / 2 / 100) * 100); msg('Auto quality: frame time stayed above 20 ms, visible cap lowered to ' + fmt(S.cap) + '.'); syncLabels(); }
  }

  // ---- main loop
  var readT = 0, simEma = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    var dt = S.lastT ? t - S.lastT : 16.7; S.lastT = t;
    if (dt > 500) dt = 16.7; // tab was hidden
    var f = S.field, i;
    if (S.spt > 0) {
      var t0 = performance.now(), n0 = f.snapCount, m0 = f.snapMsTotal;
      for (i = 0; i < S.spt; i++) f.step();
      var ms = (performance.now() - t0) / S.spt; simEma = simEma ? simEma * 0.9 + ms * 0.1 : ms;
      if (f.snapCount > n0) { S.snapMs = (f.snapMsTotal - m0) / (f.snapCount - n0); refreshScrub(); }
    }
    var st = R.render({ field: f, cx: S.cx, cy: S.cy, zoom: S.zoom, time: t / 1000, cap: S.cap, bloom: S.bloom, band: S.band, slip: S.slip, dprCap: S.dprCap });
    // frame stats over the last second
    S.frames.push({ t: t, dt: dt }); while (S.frames.length && t - S.frames[0].t > 1000) S.frames.shift();
    var sum = 0, worst = 0; for (i = 0; i < S.frames.length; i++) { sum += S.frames[i].dt; if (S.frames[i].dt > worst) worst = S.frames[i].dt; }
    var avg = sum / Math.max(1, S.frames.length);
    benchFrame(dt, st);
    autoQuality(avg, t);
    if (t - readT > 200) {
      readT = t;
      $('read').textContent =
        'frame  avg ' + avg.toFixed(1) + ' ms   worst ' + worst.toFixed(1) + ' ms\n' +
        'fps    ' + (1000 / avg).toFixed(0) + '\n' +
        'instances drawn  ' + fmt(st.instances) + ' (cap ' + fmt(S.cap) + ')\n' +
        'draw calls       ' + st.drawCalls + '\n' +
        'sim              ' + (S.spt ? simEma.toFixed(2) : '-') + ' ms/tick   tick ' + f.tick + '\n' +
        'snapshot         ' + S.snapMs.toFixed(2) + ' ms   ' + f.snaps.length + ' held, ' + f.snapMB().toFixed(1) + ' MB\n' +
        'cpu: build ' + st.buildMs.toFixed(1) + ' upload ' + st.uploadMs.toFixed(1) + ' submit ' + st.submitMs.toFixed(1) + ' ms\n' +
        'gpu timer        ' + (st.gpuMs >= 0 ? st.gpuMs.toFixed(2) + ' ms' : 'n/a') + '\n' +
        'zoom ' + S.zoom.toFixed(1) + ' px/cell  inst ' + st.instAlpha.toFixed(2) + ' dens ' + st.densAlpha.toFixed(2) + '\n' +
        'dpr ' + R.dpr + ' (render ' + R.dprUsed + ')  canvas ' + R.w + 'x' + R.h + '\n' +
        (st.band ? 'band: player density outside ' + st.band.lo.toFixed(1) + '-' + st.band.hi.toFixed(1) + '\n' : '') +
        (S.bench ? 'BENCHMARK step ' + (S.bench.i + 1) + '/' + CAPS.length : '');
    }
  }

  // test hook for headless runs
  window.__LA = {
    S: S, runResolve: function (n) { return runResolve(n); }, newWorld: newWorld,
    setView: function (cx, cy, z) { S.cx = cx; S.cy = cy; S.zoom = z; },
    setCap: function (c) { S.cap = c; syncLabels(); }, setBloom: function (b) { S.bloom = b; $('bloom').checked = b; },
    setSpeed: function (n) { S.spt = n; $('spd').value = n; syncLabels(); },
    startBench: startBench, benchText: function () { return S.lastBenchText; }, benchRunning: function () { return !!S.bench; },
    stats: function () { return { st: R.stats, frames: S.frames.length, avg: S.frames.reduce(function (a, f) { return a + f.dt; }, 0) / Math.max(1, S.frames.length), tick: S.field.tick }; }
  };

  syncLabels(); S.cap = capFromSlider(+$('cap').value); syncLabels();
  newWorld(256);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
