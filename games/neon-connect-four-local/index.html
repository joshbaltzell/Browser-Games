<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4 AI - Human vs Computer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Emergency inline styles for display */
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🔴🔵 Connect 4 AI Game</h1>
            <p class="subtitle">Red vs Blue AI • Click columns to drop pieces</p>
            <div class="status-bar">
                <span id="status">Your Turn (Red)</span>
            </div>
        </header>

        <div class="game-wrapper">
            <div class="board-container">
                <canvas id="gameBoard"></canvas>
            </div>
            
            <aside class="info-panel">
                <div class="turn-indicator">
                    <span class="turn-label">Current Turn:</span>
                    <span id="current-turn" class="turn-icon">🔴 Red</span>
                </div>
                
                <div class="score-board">
                    <div class="score-item">
                        <span class="player-name">Red Player</span>
                        <span class="score-value" id="red-score">0</span>
                    </div>
                    <div class="divider"></div>
                    <div class="score-item">
                        <span class="player-name">Blue AI</span>
                        <span class="score-value" id="blue-score">0</span>
                    </div>
                </div>

                <button id="reset-btn" class="reset-btn">↺ New Game</button>
            </aside>
        </div>

        <footer>
            <p>AI Framework © 2026 | Minimax with Alpha-Beta Pruning</p>
        </footer>
    </div>

    <!-- Load AI framework FIRST -->
    <script src="ai-framework.js"></script>
    
    <!-- Then initialize the game -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize game if Game class exists
            if (typeof Game !== 'undefined') {
                const game = new Game('gameBoard');
                game.init();
                console.log('✅ Connect 4 Game initialized!');
            } else {
                console.error('❌ Error: Game class not found in ai-framework.js');
            }

            // Reset button handler
            document.getElementById('reset-btn').addEventListener('click', () => {
                if(confirm('Start a new game?')) {
                    window.location.reload();
                }
            });
        });
    </script>
</body>
</html>
