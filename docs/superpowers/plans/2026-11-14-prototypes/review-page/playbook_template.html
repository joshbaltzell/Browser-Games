<title>Prototype Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a build binder. A fixed list of plans on the left, one plan open on the right, prompts as copyable blocks. */
:root {
  --bg: #f1f4ef;
  --surface: #ffffff;
  --ink: #1b241e;
  --muted: #5a665e;
  --line: #d3dad1;
  --accent: #1f6f4a;
  --accent-ink: #ffffff;
  --code-bg: #e8ece5;
  --display: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #19201b; --ink: #e5ebe5; --muted: #98a59b;
    --line: #2b352e; --accent: #74d19c; --accent-ink: #0d1510; --code-bg: #0d110e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #19201b; --ink: #e5ebe5; --muted: #98a59b;
  --line: #2b352e; --accent: #74d19c; --accent-ink: #0d1510; --code-bg: #0d110e;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.shell {
  max-width: 1180px; margin: 0 auto; padding-block: 28px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 36px; align-items: start;
}
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: flex; flex-direction: column; gap: 14px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; }
.sub { color: var(--muted); font-size: 0.8125rem; margin: 0; }
nav { display: flex; flex-direction: column; gap: 2px; }
.navlink {
  display: block; padding: 8px 10px; border-radius: 6px; text-decoration: none;
  color: var(--ink); font-weight: 500; font-size: 0.9375rem; border-left: 3px solid transparent;
}
.navlink:hover { background: var(--code-bg); }
.navlink.on { border-left-color: var(--accent); color: var(--accent); background: var(--surface); }
.navlink:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { min-width: 0; }
.doc { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.doc > * { margin: 0; }
.mood { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.doc h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.9rem, 4.5vw, 2.6rem); line-height: 1.08; text-wrap: balance; }
.doc h2 { font-family: var(--display); font-weight: 700; font-size: 1.4rem; line-height: 1.15; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); text-wrap: balance; }
.doc h3 { font: 600 1rem var(--body); margin-top: 10px; }
.doc p, .doc li { max-width: 74ch; }
.doc ul, .doc ol { padding-left: 1.25em; display: flex; flex-direction: column; gap: 4px; }
.doc li.todo { list-style: "☐  "; }
.doc a { color: var(--accent); }
.doc blockquote { border-left: 3px solid var(--line); padding: 2px 0 2px 14px; color: var(--muted); font-size: 0.9rem; }
.doc hr { border: 0; border-top: 1px solid var(--line); width: 100%; }
.doc code { font: 0.875em var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.doc pre { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 14px; padding-top: 44px; }
.doc pre code { display: block; background: none; padding: 0; font: 400 0.8125rem/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.copy {
  position: absolute; top: 8px; right: 8px; font: 600 0.75rem var(--body); cursor: pointer;
  border: 1px solid var(--accent); border-radius: 6px; padding: 5px 10px; background: var(--surface); color: var(--accent);
}
.art { display: flex; flex-direction: column; gap: 10px; }
.art h3 { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.gallery figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gallery img { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--line); }
.gallery figcaption { font-size: 0.8125rem; color: var(--muted); }
.kick { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kick h3 { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tw { overflow-x: auto; max-width: 100%; }
.doc table { border-collapse: collapse; font-size: 0.9rem; min-width: 100%; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.doc th { font: 600 0.75rem var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.doc td { font-variant-numeric: tabular-nums; }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side { position: static; }
  nav { flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .navlink { border-left: 0; border: 1px solid var(--line); padding: 6px 10px; }
  .navlink.on { border-color: var(--accent); }
}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">Prototype Playbook</div>
    <p class="sub">Six games, one shared kit. Plans for a cheaper model to build, with art prompts to paste into an image tool.</p>
    <nav id="nav">
{{NAV}}
    </nav>
  </aside>
  <main id="main">
{{SECTIONS}}
  </main>
</div>

<script>
(function () {
  var docs = Array.prototype.slice.call(document.querySelectorAll(".doc"));
  var links = Array.prototype.slice.call(document.querySelectorAll(".navlink"));
  function show() {
    var id = (location.hash || "#overview").slice(1);
    if (!docs.some(function (d) { return d.dataset.doc === id; })) id = "overview";
    docs.forEach(function (d) { d.hidden = d.dataset.doc !== id; });
    links.forEach(function (a) { a.classList.toggle("on", a.dataset.doc === id); });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", show);
  show();

  Array.prototype.forEach.call(document.querySelectorAll(".doc pre"), function (pre, i) {
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "copy"; btn.id = "copy-" + i; btn.textContent = "Copy";
    btn.addEventListener("click", function () {
      var code = pre.querySelector("code") || pre;
      var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1500); };
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents(code);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = "Selected";
      };
      try { navigator.clipboard.writeText(code.textContent).then(done, fallback); } catch (e) { fallback(); }
    });
    pre.appendChild(btn);
  });
})();
</script>
